<!DOCTYPE html>
<html>
<head>
    <title>claire's how to make almost anything</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E🗂️%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@300;400;500;600;700&display=block" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/98.css">
    <link rel="stylesheet" href="style-new.css">
    <!-- Prism.js for syntax highlighting -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet">
</head>
<body>
    <!-- Week icons and modals will be generated dynamically by windows.js -->

    <!-- Static windows will be generated dynamically by windows.js -->
    

    <!-- Music Player Widget -->
    <div class="window music-player" draggable="true">
        <div class="title-bar">
            <div class="title-bar-text">claire's music player</div>
        </div>
        <div class="window-body">
            <div class="controls">
                <button onclick="playMusic()">Play</button>
                <button onclick="pauseMusic()">Pause</button>
                <!-- <button onclick="stopMusic()">Stop</button> -->
                <div class="status-bar">
                    <div class="status-bar-field" id="trackInfo">No track loaded</div>
                </div>
                <div class="field-row">
                    <label for="volume">Vol:</label>
                    <input type="range" id="volume" min="0" max="100" value="50" onchange="setVolume(this.value)">
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden audio element -->
    <audio id="audioPlayer" loop>
        <source src="https://hc-cdn.hel1.your-objectstorage.com/s/v3/e2f2e39e4d033a564b4fdbf03df6ff51d40a3803_chinatown_live_newhaven_audio.mp4" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <!-- Scripts at the end for proper loading -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
    <script src="windows.js"></script>

</body>
</html>
